<script>
  (() => {
    const panels = [...document.querySelectorAll(".post-sidebar > details")];
    const desktop = matchMedia("(min-width: 75rem)");
    const setDefaults = () => {
      for (const panel of panels) {
        panel.open = desktop.matches && panel.hasAttribute("data-open-on-desktop");
      }
    };

    setDefaults();
    desktop.addEventListener("change", setDefaults);

    for (const panel of panels) {
      panel.addEventListener("toggle", () => {
        if (!desktop.matches && panel.open) {
          for (const other of panels) {
            if (other !== panel) other.open = false;
          }
        }
      });
      panel.addEventListener("click", event => {
        if (!desktop.matches && event.target.closest('a[href^="#"]')) {
          panel.open = false;
        }
      });
    }
  })();
</script>

        if (scrollPosition) {

        }
        
        
        let menuScrollTimeout;
        menu.addEventListener("scroll", function () {
            clearTimeout(menuScrollTimeout);
            menuScrollTimeout = setTimeout(function () {
                localStorage.setItem("menu-scroll-position", menu.scrollLeft);
            }, 150);
        }, { passive: true });
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            const target = document.querySelector(`[id='${decodeURIComponent(id)}']`);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                target.scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                target.scrollIntoView();
            }
            
            
            if (target.tabIndex < 0 && !target.hasAttribute("tabindex")) {
                target.setAttribute("tabindex", "-1");
            }
            target.focus({ preventScroll: true });
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
<script>
    var toplink = document.getElementById("top-link");
    var scrollTicking = false;
    
    window.addEventListener("scroll", function () {
        if (scrollTicking) {
            return;
        }
        scrollTicking = true;
        requestAnimationFrame(function () {
            const scrollThreshold = window.innerHeight;
            const shown = document.body.scrollTop > scrollThreshold || document.documentElement.scrollTop > scrollThreshold;
            toplink.classList.toggle("hidden", !shown);
            scrollTicking = false;
        });
    }, { passive: true });

</script>
